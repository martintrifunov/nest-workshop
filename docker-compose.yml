services:
  postgres:
    image: postgres:16-alpine
    container_name: nest-workshop-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zoo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nest-workshop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      GATEWAY_URL: http://zoo-gateway:5555
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - zoo-network

  zoo-animals:
    build:
      context: ./services/animals
    container_name: zoo-animals
    restart: unless-stopped
    ports:
      - "4001:4001"
    networks:
      - zoo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  zoo-employees:
    build:
      context: ./services/employees
    container_name: zoo-employees
    restart: unless-stopped
    ports:
      - "4002:4002"
    networks:
      - zoo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  zoo-schedule:
    build:
      context: ./services/schedule
    container_name: zoo-schedule
    restart: unless-stopped
    ports:
      - "4003:4003"
    networks:
      - zoo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  zoo-gateway:
    build:
      context: ./gateway
    container_name: zoo-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zoo-animals:
        condition: service_healthy
      zoo-employees:
        condition: service_healthy
      zoo-schedule:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      GATEWAY_PORT: "5555"
      DOCKER_INTERNAL_HOST: host.docker.internal
      SEED_ANIMALS_URL: http://zoo-animals:4001
      SEED_EMPLOYEES_URL: http://zoo-employees:4002
      SEED_SCHEDULE_URL: http://zoo-schedule:4003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5555:5555"
    networks:
      - zoo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5555/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  zoo-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: zoo-frontend
    restart: unless-stopped
    depends_on:
      - app
      - zoo-gateway
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_GATEWAY_URL: http://localhost:5555
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - zoo-network

volumes:
  postgres_data:

networks:
  zoo-network:
    driver: bridge